<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdaraBot</title>
    <style>
        * {
            margin: 0.2;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 50%, #f3e8ff 100%);
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(to right, #9B2A2A, #9333ea);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #6b7280;
            font-size: 1.125rem;
        }

        .chat-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: none;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(to right, #9B2A2A, #9333ea);
            color: white;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .icon {
            width: 1.5rem;
            height: 1.5rem;
            fill: currentColor;
        }

        .messages-container {
            height: 500px;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .empty-icon {
            width: 4rem;
            height: 4rem;
            color: #d1d5db;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }

        .empty-text {
            color: #9ca3af;
        }

        .message {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .message.user {
            justify-content: flex-start;
        }

        .message.bot {
            justify-content: flex-end;
        }

        .message-content {
            display: flex;
            gap: 0.75rem;
            max-width: 80%;
        }

        .message.user .message-content {
            flex-direction: row;
        }

        .message.bot .message-content {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar.user {
            background: #9333ea;
            color: white;
        }

        .avatar.bot {
            background: #9333ea;
            color: white;
        }

        .message-bubble {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: #9333ea;
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .message.bot .message-bubble {
            background: #f3f4f6;
            color: #374151;
            border-bottom-left-radius: 0.25rem;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-style: italic;
            color: #6b7280;
        }

        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid #e5e7eb;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .input-area {
            border-top: 1px solid #e5e7eb;
            background: rgba(249, 250, 251, 0.5);
            padding: 1rem;
        }

        .input-form {
            display: flex;
            gap: 0.75rem;
        }

        .input-field {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            text-align: right;
            background: white;
            transition: all 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .send-button {
            background: linear-gradient(to right, #9B2A2A, #9333ea);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-button:hover:not(:disabled) {
            background: linear-gradient(to right, #2563eb, #7c3aed);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #6b7280;
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .title {
                font-size: 2rem;
            }
            
            .messages-container {
                height: 400px;
            }
            
            .message-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">روبوت المحادثة الذكي IdaraBot</h1>
            <p class="subtitle">مرحبًا! 👋
أنا مساعدك الذكي في الإجراءات الإدارية التونسية</p>
        </div>

        <div class="chat-card">
            <div class="chat-header">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V19C3 20.1 3.9 21 5 21H11V19H5V3H13V9H21Z"/>
                </svg>
                <h2>IdaraBot</h2>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <svg class="empty-icon" viewBox="0 0 24 24">
                        <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V19C3 20.1 3.9 21 5 21H11V19H5V3H13V9H21Z"/>
                    </svg>
                    <h3 class="empty-title">مرحباً بك!</h3>
                    <p class="empty-text">ابدأ محادثة جديدة بكتابة سؤالك أدناه, يمكنك سؤالي عن أي شيء يخص الإجراءات الإدارية في تونس 🇹🇳.</p>
                </div>
            </div>

            <div class="input-area">
                <form class="input-form" id="chatForm">
                    <button type="submit" class="send-button" id="sendButton">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/>
                        </svg>
                    </button>
                    <input type="text" class="input-field" id="messageInput" placeholder="اكتب سؤالك هنا..." autocomplete="off">
                </form>
            </div>
        </div>

        <div class="footer">
            <p>مدعوم بالذكاء الاصطناعي • يمكنني الإجابة على أسئلتك بناءً على قاعدة المعرفة</p>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messagesContainer');
        const emptyState = document.getElementById('emptyState');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        let isLoading = false;

        function hideEmptyState() {
            if (emptyState) {
                emptyState.style.display = 'none';
            }
        }

        function addMessage(content, type, isLoading = false) {
            hideEmptyState();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatarIcon = type === 'user' 
                ? '<path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/>'
                : '<path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V19C3 20.1 3.9 21 5 21H11V19H5V3H13V9H21Z"/>';

            messageDiv.innerHTML = `
                <div class="message-content">
                    <div class="avatar ${type}">
                        <svg class="icon" viewBox="0 0 24 24">
                            ${avatarIcon}
                        </svg>
                    </div>
                    <div class="message-bubble">
                        ${isLoading ? '<div class="loading"><div class="spinner"></div>جاري المعالجة...</div>' : content}
                    </div>
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return messageDiv;
        }

        function updateMessage(messageElement, content) {
            const bubble = messageElement.querySelector('.message-bubble');
            bubble.textContent = content;
        }

        async function sendMessage(message) {
            if (!message.trim() || isLoading) return;
            
            isLoading = true;
            sendButton.disabled = true;
            
            addMessage(message, 'user');
            messageInput.value = '';
            
            const loadingMessage = addMessage('', 'bot', true);
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: message }]
                    })
                });

                if (!response.ok) {
                    throw new Error('فشل في الحصول على الرد');
                }

                const data = await response.json();
                loadingMessage.remove();
                addMessage(data.answer || 'عذراً، لم أتمكن من معالجة طلبك', 'bot');
                
            } catch (error) {
                loadingMessage.remove();
                addMessage('عذراً، حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.', 'bot');
            } finally {
                isLoading = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage(messageInput.value);
        });

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(messageInput.value);
            }
        });

        messageInput.focus();
    </script>
</body>
</html>
